{% extends "vs_base.html" %}

{% block title %}Prompts{% endblock %}

{% block content %}
  <div class="container-fluid">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h3 class="mb-1">Prompts</h3>
        <div class="vs-text-body">Update the system prompt used for AI comment moderation.</div>
      </div>
    </div>

    <div class="card shadow-sm mb-4 vs-card">
      <div class="card-body">
        <form method="post" class="row g-3">
          <div class="col-12">
            <label class="form-label vs-card-title">Comment moderation system prompt</label>
            <textarea
              name="comment_moderation_prompt"
              class="form-control vs-input"
              rows="8"
              placeholder="Leave blank to use the default prompt."
            >{{ comment_moderation_prompt }}</textarea>
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn vs-btn vs-btn-primary d-flex align-items-center gap-2">
              <span class="material-symbols-outlined" aria-hidden="true">save</span>
              <span>Save</span>
            </button>
            <span class="small vs-text-body">Saving empty resets to default.</span>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
