{% extends "vs_marketing_base.html" %}

{% block extra_styles %}
  {{ super() }}
  <style>
    .vs-auth-page {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: clamp(2.25rem, 4vw, 3.5rem) 0 clamp(3rem, 5vw, 4.25rem);
    }

    .vs-auth-page .alert {
      margin-bottom: 1rem;
    }
  </style>
{% endblock %}

{% block content %}
  <section class="vs-auth-page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{cat}} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endwith %}
    {% block auth_content %}{% endblock %}
  </section>
{% endblock %}
