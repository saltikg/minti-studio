{% extends "vs_marketing_base.html" %}

{% block extra_styles %}
  {{ super() }}
  <style>
    .vs-auth-page {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: clamp(2.25rem, 4vw, 3.5rem) 0 clamp(3rem, 5vw, 4.25rem);
    }

    .vs-auth-page .card {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }

    .vs-auth-page .card-body,
    .vs-auth-page .card-title,
    .vs-auth-page .vs-app-brand span {
      color: rgba(248, 250, 252, 0.96);
    }

    .vs-auth-page .form-label {
      color: rgba(248, 250, 252, 0.96) !important;
    }

    .vs-auth-page .small,
    .vs-auth-page .text-muted,
    .vs-auth-page p {
      color: rgba(226, 232, 240, 0.88);
    }

    .vs-auth-page .form-control {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border);
      color: rgba(248, 250, 252, 0.96);
    }

    .vs-auth-page .form-control::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .vs-auth-page a {
      color: var(--mint);
    }

    .vs-auth-page a:hover {
      color: var(--mint-2);
    }

    .vs-auth-page .alert {
      margin-bottom: 1rem;
    }
  </style>
{% endblock %}

{% block content %}
  <section class="vs-auth-page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{cat}} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endwith %}
    {% block auth_content %}{% endblock %}
  </section>
{% endblock %}
