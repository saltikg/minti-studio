<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Autopilot is on | Minti Studio</title>
    <link rel="icon" href="{{ url_for('static', filename='img/minti_favicon.svg') }}">
    <style>
      :root {
        color-scheme: dark;
        --bg: #020617;
        --panel: rgba(15, 23, 42, 0.74);
        --text: #f8fafc;
        --muted: rgba(226, 232, 240, 0.78);
        --line: rgba(148, 163, 184, 0.18);
        --accent: #2dd4bf;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        margin: 0;
        background:
          radial-gradient(circle at 50% 0%, rgba(45, 212, 191, 0.18), transparent 36%),
          linear-gradient(180deg, #08111f 0%, var(--bg) 62%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .confirm-shell {
        display: flex;
        min-height: 100svh;
        align-items: stretch;
        justify-content: center;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      .confirm-panel {
        display: flex;
        width: 100%;
        min-height: 100svh;
        max-width: 520px;
        flex-direction: column;
        padding: 38px 22px 24px;
      }
      .confirm-panel.is-hidden {
        display: none;
      }
      .confirm-main {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
      }
      .confirm-title {
        margin: 0;
        font-size: clamp(2.25rem, 13vw, 4rem);
        font-weight: 900;
        line-height: 0.98;
      }
      .confirm-intro {
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 1.12rem;
        line-height: 1.5;
      }
      .confirm-steps {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }
      .confirm-step {
        display: grid;
        grid-template-columns: 44px 1fr;
        align-items: center;
        gap: 12px;
        min-height: 66px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.58);
        padding: 12px 14px;
      }
      .confirm-step-icon {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 999px;
        background: rgba(45, 212, 191, 0.1);
        font-size: 1.35rem;
      }
      .confirm-step-text {
        margin: 0;
        color: #f1f5f9;
        font-size: 1.02rem;
        font-weight: 750;
        line-height: 1.28;
      }
      .confirm-action {
        width: 100%;
        min-height: 58px;
        margin-top: 28px;
        border: 0;
        border-radius: 16px;
        background: linear-gradient(135deg, #2dd4bf, #38bdf8);
        color: #031019;
        cursor: pointer;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 900;
        box-shadow: 0 18px 44px rgba(45, 212, 191, 0.24);
      }
      .confirm-action:focus-visible {
        outline: 3px solid rgba(125, 211, 252, 0.92);
        outline-offset: 3px;
      }
      .confirm-thanks {
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .confirm-thanks .confirm-title {
        font-size: clamp(2.7rem, 15vw, 4.8rem);
      }
      .confirm-thanks .confirm-intro {
        max-width: 360px;
        margin-right: auto;
        margin-left: auto;
      }
      .confirm-secondary {
        display: inline-flex;
        margin: 24px auto 0;
        color: rgba(226, 232, 240, 0.76);
        font-size: 0.95rem;
        font-weight: 750;
        text-decoration: none;
      }
      @media (min-width: 760px) {
        .confirm-shell {
          align-items: center;
          padding: 32px;
        }
        .confirm-panel {
          min-height: auto;
          border: 1px solid var(--line);
          border-radius: 28px;
          background: var(--panel);
          padding: 42px;
          box-shadow: 0 28px 80px rgba(2, 6, 23, 0.46);
        }
        .confirm-main {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main class="confirm-shell">
      <section class="confirm-panel" data-confirm-step="intro" aria-labelledby="confirmTitle">
        <div class="confirm-main">
          <h1 class="confirm-title" id="confirmTitle">🎉 You're all set — Autopilot is on</h1>
          <p class="confirm-intro">Here's what happens next:</p>
          <div class="confirm-steps" aria-label="What happens next">
            <div class="confirm-step">
              <span class="confirm-step-icon" aria-hidden="true">📩</span>
              <p class="confirm-step-text">You'll get an email from us</p>
            </div>
            <div class="confirm-step">
              <span class="confirm-step-icon" aria-hidden="true">✂️</span>
              <p class="confirm-step-text">We'll create Shorts from your videos</p>
            </div>
            <div class="confirm-step">
              <span class="confirm-step-icon" aria-hidden="true">🚀</span>
              <p class="confirm-step-text">We'll share them with you and publish to your channel</p>
            </div>
          </div>
        </div>
        <button type="button" class="confirm-action" id="confirmGotIt">Got it — let's go</button>
      </section>

      <section class="confirm-panel confirm-thanks is-hidden" data-confirm-step="thanks" aria-live="polite">
        <div class="confirm-main confirm-thanks">
          <h1 class="confirm-title">You're in 🎉</h1>
          <p class="confirm-intro">Thanks! We'll be in touch by email soon.</p>
          <a class="confirm-secondary" href="{{ my_videos_url }}">Continue to My Videos</a>
        </div>
      </section>
    </main>
    <script>
      (() => {
        const myVideosUrl = {{ my_videos_url|tojson }};
        const intro = document.querySelector('[data-confirm-step="intro"]');
        const thanks = document.querySelector('[data-confirm-step="thanks"]');
        const button = document.getElementById("confirmGotIt");
        let redirectTimer = null;

        const continueToMyVideos = () => {
          window.clearTimeout(redirectTimer);
          window.location.assign(myVideosUrl);
        };

        button?.addEventListener("click", () => {
          intro?.classList.add("is-hidden");
          thanks?.classList.remove("is-hidden");
          redirectTimer = window.setTimeout(continueToMyVideos, 2000);
        });

        thanks?.querySelector("a")?.addEventListener("click", (event) => {
          event.preventDefault();
          continueToMyVideos();
        });
      })();
    </script>
  </body>
</html>
