<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ clip_title }} | MintiStudio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07121b;
        --panel: rgba(12, 24, 36, 0.94);
        --panel-border: rgba(126, 239, 217, 0.18);
        --text: #eef7f6;
        --muted: rgba(238, 247, 246, 0.72);
        --accent: #6ee7d8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(110, 231, 216, 0.16), transparent 38%),
          linear-gradient(180deg, #07121b 0%, #091119 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .watch-shell {
        width: min(100%, 560px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 28px 72px rgba(0, 0, 0, 0.34);
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.35rem, 2vw, 1.8rem);
        line-height: 1.15;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.98rem;
      }
      video {
        display: block;
        width: 100%;
        border-radius: 18px;
        background: #000;
      }
      .watch-footer {
        margin-top: 18px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        text-align: center;
        font-size: 0.92rem;
      }
      .watch-footer a {
        color: var(--accent);
        text-decoration: none;
      }
      .watch-footer a:hover,
      .watch-footer a:focus-visible {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="watch-shell">
      <h1>{{ clip_title }}</h1>
      <p>Watch this short clip shared from MintiStudio.</p>
      <video id="shared-short-video" controls playsinline preload="metadata"{% if poster_url %} poster="{{ poster_url }}"{% endif %}>
        <source src="{{ playback_url }}" type="video/mp4">
      </video>
      <div class="watch-footer">
        <a href="https://mintistudio.com" target="_blank" rel="noreferrer">MintiStudio ile uzun videolarını otomatik short'a çevir</a>
      </div>
    </main>
    <script>
      (() => {
        const eventUrl = {{ event_url|tojson }};
        const video = document.getElementById("shared-short-video");
        if (!eventUrl || !video) {
          return;
        }
        const fireEvent = (type) => {
          const body = JSON.stringify({ type });
          if (navigator.sendBeacon) {
            const blob = new Blob([body], { type: "application/json" });
            navigator.sendBeacon(eventUrl, blob);
            return;
          }
          fetch(eventUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body,
            keepalive: true,
            credentials: "omit",
          }).catch(() => {});
        };
        fireEvent("view");
        let playTracked = false;
        video.addEventListener("play", () => {
          if (playTracked) {
            return;
          }
          playTracked = true;
          fireEvent("play");
        }, { passive: true });
      })();
    </script>
  </body>
</html>
