<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video not available | MintiStudio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07121b;
        --panel: rgba(12, 24, 36, 0.94);
        --panel-border: rgba(126, 239, 217, 0.18);
        --text: #eef7f6;
        --muted: rgba(238, 247, 246, 0.72);
        --accent: #6ee7d8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(110, 231, 216, 0.16), transparent 38%),
          linear-gradient(180deg, #07121b 0%, #091119 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .unavailable-shell {
        width: min(100%, 520px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 28px 72px rgba(0, 0, 0, 0.34);
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.35rem, 2vw, 1.7rem);
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="unavailable-shell">
      <h1>{{ clip_title }}</h1>
      <p>This shared video is not available right now.</p>
      <a href="https://mintistudio.com" target="_blank" rel="noreferrer">Made with MintiStudio</a>
    </main>
  </body>
</html>
