<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BFML4VLWMF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  var mintiConsentRegion = [
    'AT', 'BE', 'BG', 'CH', 'CY', 'CZ', 'DE', 'DK', 'EE', 'ES', 'FI', 'FR',
    'GB', 'GR', 'HR', 'HU', 'IE', 'IS', 'IT', 'LI', 'LT', 'LU', 'LV', 'MT',
    'NL', 'NO', 'PL', 'PT', 'RO', 'SE', 'SI', 'SK'
  ];
  var mintiConsentCookieName = 'minti_analytics_consent';
  var mintiConsentChoice = document.cookie.split(';').map(function (item) {
    return item.trim();
  }).find(function (item) {
    return item.indexOf(mintiConsentCookieName + '=') === 0;
  });
  mintiConsentChoice = mintiConsentChoice ? mintiConsentChoice.split('=', 2)[1] : '';

  var mintiGrantedConsent = {
    ad_storage: 'granted',
    analytics_storage: 'granted',
    ad_user_data: 'granted',
    ad_personalization: 'granted'
  };
  var mintiDeniedConsent = {
    ad_storage: 'denied',
    analytics_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied'
  };

  gtag('consent', 'default', mintiGrantedConsent);
  gtag('consent', 'default', Object.assign({
    region: mintiConsentRegion,
    wait_for_update: 500
  }, mintiDeniedConsent));
  if (mintiConsentChoice === 'accepted') {
    gtag('consent', 'update', mintiGrantedConsent);
  } else if (mintiConsentChoice === 'declined') {
    gtag('consent', 'update', mintiDeniedConsent);
  }

  function mintiSanitizedPageLocation() {
    var url = new URL(window.location.href);
    var sensitiveNames = /(^|_)(email|e_mail|name|token|code|state|password|secret|signature|sig|auth|key|next|redirect_uri|return_to|continue)($|_)/i;
    Array.from(url.searchParams.keys()).forEach(function (key) {
      if (!/^utm_(source|medium|campaign|term|content)$/i.test(key) && sensitiveNames.test(key)) {
        url.searchParams.delete(key);
      }
    });
    var safePathname = url.pathname.replace(/(\/onboard\/)[^/]+/i, '$1[redacted]');
    return url.origin + safePathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : '');
  }

  var mintiHasInternalTrafficCookie = document.cookie.split(';').some(function (item) {
    return item.trim() === 'minti_internal_traffic=true';
  });
  var mintiGaSharedParams = { page_location: mintiSanitizedPageLocation() };
  if (mintiHasInternalTrafficCookie) {
    mintiGaSharedParams.traffic_type = 'internal';
  }

  gtag('config', 'G-BFML4VLWMF', mintiGaSharedParams);

  function trackMintiEvent(eventName, params = {}) {
    if (typeof gtag === 'function') {
      var eventParams = mintiHasInternalTrafficCookie
        ? Object.assign({ traffic_type: 'internal' }, params)
        : params;
      gtag('event', eventName, eventParams);
    }
  }

  function mintiSaveAnalyticsConsent(choice) {
    var secure = window.location.protocol === 'https:' ? '; Secure' : '';
    document.cookie = mintiConsentCookieName + '=' + choice
      + '; Max-Age=15552000; Path=/; SameSite=Lax' + secure;
    gtag('consent', 'update', choice === 'accepted' ? mintiGrantedConsent : mintiDeniedConsent);
    var banner = document.querySelector('[data-ga-consent-banner]');
    if (banner) banner.hidden = true;
  }

  document.addEventListener('DOMContentLoaded', function () {
    var banner = document.querySelector('[data-ga-consent-banner]');
    if (!banner || mintiConsentChoice) return;
    banner.hidden = false;
    banner.querySelector('[data-ga-consent-accept]')?.addEventListener('click', function () {
      mintiSaveAnalyticsConsent('accepted');
    });
    banner.querySelector('[data-ga-consent-decline]')?.addEventListener('click', function () {
      mintiSaveAnalyticsConsent('declined');
    });
  });
</script>
