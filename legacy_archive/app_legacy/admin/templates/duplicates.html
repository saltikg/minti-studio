<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Duplicate Posts – Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body { font-family: sans-serif; margin: 40px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
    img.thumb { width: 80px; border-radius: 8px; }
    th { background: #fafafa; }
    .delete-btn { color: red; text-decoration: none; font-weight: bold; }
    .toolbar { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>🧹 Duplicate Blog Posts</h2>
  <form method="POST" action="{{ url_for('admin_bp.delete_selected') }}">
    <div class="toolbar">
      <button type="submit" style="background:red;color:white;padding:8px 14px;border:none;border-radius:4px;">
        Delete Selected
      </button>
    </div>
    <table>
      <tr><th></th><th>Image</th><th>Title</th><th>Updated</th><th>Delete</th></tr>
      {% for r in rows %}
      <tr>
        <td><input type="checkbox" name="selected_ids" value="{{ r.idea_id }}"></td>
        <td>
          {% if r.hero_image %}
            <img src="{{ r.hero_image }}" class="thumb">
          {% endif %}
        </td>
        <td>{{ r.title }}</td>
        <td>{{ r.updated_at }}</td>
        <td><a href="{{ url_for('admin_bp.delete_one', idea_id=r.idea_id) }}" class="delete-btn">X</a></td>
      </tr>
      {% endfor %}
    </table>
  </form>
</body>
</html>
