{% extends "admin_base.html" %}
{% block content %}
<div class="container py-4">
  <h2>🧩 Idea Planner Panel</h2>
  <hr>
  <button id="updateTrends" class="btn btn-primary">Trendleri Güncelle</button>
  <button id="generatePlan" class="btn btn-success">Fikir Planı Oluştur (LLM)</button>
  <button id="savePlan" class="btn btn-info">Kaydet DB’ye</button>
  <div id="trendResult" class="mt-3"></div>
  <div id="ideaResult" class="mt-3"></div>
</div>
 

  <div id="trendResult" class="mt-3"></div>
  <div id="ideaResult" class="mt-3"></div>
</div>

<script>
document.getElementById("updateTrends").onclick = async () => {
  const res = await fetch("/admin/idea-planner/trends", {method:"POST"});
  const data = await res.json();
  document.getElementById("trendResult").innerHTML =
    `<pre>${JSON.stringify(data.trends, null, 2)}</pre>`;
};

document.getElementById("generatePlan").onclick = async () => {
  const res = await fetch("/admin/idea-planner/plan", {method:"POST"});
  const data = await res.json();
  window.generatedIdeas = data.ideas;
  document.getElementById("ideaResult").innerHTML =
    `<pre>${JSON.stringify(data.ideas, null, 2)}</pre>`;
};

document.getElementById("savePlan").onclick = async () => {
  const res = await fetch("/admin/idea-planner/save", {
    method:"POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ideas: window.generatedIdeas || []})
  });
  const data = await res.json();
  alert(data.message);
};
</script>
{% endblock %}
