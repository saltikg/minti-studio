{% extends "admin_base.html" %}
{% block title %}Content Stats - Admin{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="h5 mb-0">📈 Content Creation Stats</h2>
  <form method="get" class="d-flex align-items-center">
    <label class="me-2 small text-muted">From:</label>
    <input type="date" name="start" value="{{ start_date }}" class="form-control form-control-sm me-2">
    <label class="me-2 small text-muted">To:</label>
    <input type="date" name="end" value="{{ end_date }}" class="form-control form-control-sm me-2">
    <button type="submit" class="btn btn-sm btn-primary">Apply</button>
  </form>
</div>

<div class="card shadow-sm mb-4">
  <div class="card-body">
    <h6 class="text-muted mb-3">
      Total posts in range:
      <span class="fw-bold text-dark">{{ counts | sum }}</span>
    </h6>
    <canvas id="contentChart" height="120"></canvas>
  </div>
</div>

<!-- ✅ Sıra önemli: önce Chart.js, sonra plugin -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {

  const chartLabels = JSON.parse('{{ labels|tojson|safe or "[]" }}');
  const chartCounts = JSON.parse('{{ counts|tojson|safe or "[]" }}');

  if (chartLabels.length === 0) {
    console.warn("No chart data found");
    return;
  }

  const ctx = document.getElementById('contentChart').getContext('2d');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: chartLabels,
      datasets: [{
        label: 'Posts Created',
        data: chartCounts,
        backgroundColor: 'rgba(0, 123, 255, 0.6)',
        borderColor: 'rgba(0, 123, 255, 1)',
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { enabled: true },
        datalabels: {
          anchor: 'end',
          align: 'end',
          color: '#000',
          font: { weight: 'bold' },
          formatter: (value) => value
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'Date' },
          ticks: { autoSkip: true, maxTicksLimit: 10 }
        },
        y: {
          beginAtZero: true,
          title: { display: true, text: 'Number of Posts' }
        }
      }
    },
    plugins: [ChartDataLabels] // 🔹 plugin son satırda bağlanıyor
  });

});
</script>
{% endblock %}
