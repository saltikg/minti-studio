<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minti Studio pipeline diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0a1a2e"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#9fb3c8"/>
    </marker>

    <style>
      .title { font: 700 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #e6f0ff; }
      .subtitle { font: 500 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #b8c7db; }
      .box { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.18); stroke-width: 1; rx: 18; }
      .box2 { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.14); stroke-width: 1; rx: 18; }
      .boxTitle { font: 700 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #e6f0ff; }
      .boxText { font: 500 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #b8c7db; }
      .pill { fill: rgba(99,179,237,0.18); stroke: rgba(99,179,237,0.35); stroke-width: 1; rx: 999; }
      .pillText { font: 600 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #d7ecff; }
      .line { stroke: #9fb3c8; stroke-width: 2; opacity: 0.9; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 6; opacity: 0.7; }
      .caption { font: 600 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #cfe1ff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="url(#bg)"/>

  <!-- Header -->
  <text x="56" y="64" class="title">Minti Studio: AI assisted content pipeline</text>
  <text x="56" y="90" class="subtitle">End to end flow with production safeguards, monitoring, and SLA style run metrics</text>

  <!-- Main pipeline boxes -->
  <g filter="url(#shadow)">
    <!-- Ingest -->
    <rect x="56" y="140" width="160" height="86" class="box"/>
    <text x="78" y="172" class="boxTitle">Ingest</text>
    <text x="78" y="196" class="boxText">APIs, files, feeds</text>

    <!-- Normalize -->
    <rect x="246" y="140" width="160" height="86" class="box"/>
    <text x="268" y="172" class="boxTitle">Normalize</text>
    <text x="268" y="196" class="boxText">schema, cleaning</text>

    <!-- Rank -->
    <rect x="436" y="140" width="160" height="86" class="box"/>
    <text x="458" y="172" class="boxTitle">Rank</text>
    <text x="458" y="196" class="boxText">embeddings</text>

    <!-- Generate -->
    <rect x="626" y="140" width="160" height="86" class="box"/>
    <text x="648" y="172" class="boxTitle">Generate</text>
    <text x="648" y="196" class="boxText">LLM outputs</text>

    <!-- Render -->
    <rect x="816" y="140" width="160" height="86" class="box"/>
    <text x="838" y="172" class="boxTitle">Render</text>
    <text x="838" y="196" class="boxText">FFmpeg</text>

    <!-- Publish -->
    <rect x="1006" y="140" width="138" height="86" class="box"/>
    <text x="1028" y="172" class="boxTitle">Publish</text>
    <text x="1028" y="196" class="boxText">channels</text>
  </g>

  <!-- Arrows -->
  <line x1="216" y1="183" x2="246" y2="183" class="line"/>
  <line x1="406" y1="183" x2="436" y2="183" class="line"/>
  <line x1="596" y1="183" x2="626" y2="183" class="line"/>
  <line x1="786" y1="183" x2="816" y2="183" class="line"/>
  <line x1="976" y1="183" x2="1006" y2="183" class="line"/>

  <!-- Reliability section -->
  <g filter="url(#shadow)">
    <rect x="56" y="260" width="560" height="208" class="box2"/>
    <text x="78" y="294" class="caption">Production safeguards</text>

    <!-- Pills -->
    <rect x="78" y="316" width="150" height="34" class="pill"/>
    <text x="96" y="338" class="pillText">Idempotent runs</text>

    <rect x="240" y="316" width="118" height="34" class="pill"/>
    <text x="258" y="338" class="pillText">Backfills</text>

    <rect x="370" y="316" width="150" height="34" class="pill"/>
    <text x="388" y="338" class="pillText">Deduplication</text>

    <rect x="78" y="364" width="110" height="34" class="pill"/>
    <text x="96" y="386" class="pillText">Retries</text>

    <rect x="200" y="364" width="140" height="34" class="pill"/>
    <text x="218" y="386" class="pillText">Rate limiting</text>

    <rect x="352" y="364" width="150" height="34" class="pill"/>
    <text x="370" y="386" class="pillText">Run logging</text>

    <rect x="78" y="412" width="210" height="34" class="pill"/>
    <text x="96" y="434" class="pillText">Schema change handling</text>
  </g>

  <!-- Monitoring section -->
  <g filter="url(#shadow)">
    <rect x="640" y="260" width="504" height="208" class="box2"/>
    <text x="662" y="294" class="caption">Monitoring and reporting</text>

    <rect x="662" y="316" width="216" height="58" class="box"/>
    <text x="682" y="346" class="boxTitle">DuckDB</text>
    <text x="682" y="366" class="boxText">analytical store</text>

    <rect x="896" y="316" width="228" height="58" class="box"/>
    <text x="916" y="346" class="boxTitle">Run metrics</text>
    <text x="916" y="366" class="boxText">freshness, completeness, success</text>

    <rect x="662" y="388" width="462" height="58" class="box"/>
    <text x="682" y="418" class="boxTitle">Data quality checks</text>
    <text x="682" y="438" class="boxText">guardrails for reliable visualizations and decisions</text>
  </g>

  <!-- Dotted links from pipeline to monitoring -->
  <line x1="326" y1="226" x2="770" y2="316" class="line dashed"/>
  <line x1="707" y1="226" x2="1010" y2="316" class="line dashed"/>
</svg>
